<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Wallet Balance Tracker</title>
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #09090b;
            --surface: #121216;
            --surface-card: #18181f;
            --surface-hover: #22222b;
            --text-main: #f4f4f5;
            --text-muted: #a1a1aa;
            --border-color: rgba(255, 255, 255, 0.08);
            --primary: #6366f1;
            --emerald: #10b981;
            --rose: #f43f5e;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        body {
            background-color: var(--bg);
            color: var(--text-main);
            font-family: 'Plus Jakarta Sans', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            touch-action: manipulation;
        }

        .app-container {
            width: 100%;
            max-width: 440px;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 24px 20px 40px 20px;
            position: relative;
        }

        /* Glassmorphism */
        .glass-card {
            background: rgba(24, 24, 31, 0.85);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--border-color);
            border-radius: 24px;
        }

        .blur-balance {
            filter: blur(8px);
            transition: filter 0.25s ease;
        }

        /* Header */
        header {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: 24px;
        }

        .top-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .brand-icon {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
        }

        .action-btns {
            display: flex;
            gap: 8px;
        }

        .icon-btn {
            width: 42px;
            height: 42px;
            border-radius: 50%;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            transition: 0.2s;
        }

        .icon-btn:active {
            transform: scale(0.95);
        }

        /* Net Worth Card */
        .net-worth-card {
            padding: 24px;
            position: relative;
            overflow: hidden;
        }

        .net-worth-card h2 {
            font-size: 32px;
            font-weight: 800;
            letter-spacing: -0.5px;
            margin-top: 4px;
        }

        .distribution-bar {
            height: 8px;
            width: 100%;
            border-radius: 4px;
            background: #27272a;
            overflow: hidden;
            display: flex;
            gap: 2px;
            margin-top: 16px;
        }

        /* Action Buttons Grid */
        .grid-actions {
            display: grid;
            grid-template-columns: 1fr 1fr 1fr;
            gap: 10px;
        }

        .btn-action {
            height: 50px;
            border-radius: 16px;
            font-weight: 700;
            font-size: 13px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            cursor: pointer;
            border: none;
            transition: 0.2s;
        }

        .btn-action:active {
            transform: scale(0.95);
        }

        .btn-primary-action {
            background: var(--emerald);
            color: #000;
        }

        .btn-secondary-action {
            background: #f4f4f5;
            color: #000;
        }

        .btn-outline-action {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-main);
        }

        /* Accounts List */
        main {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .section-title {
            font-size: 11px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            color: var(--text-muted);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .accounts-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .account-card {
            padding: 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            cursor: pointer;
            transition: 0.2s;
            border-left: 4px solid transparent;
        }

        .account-card:active {
            transform: scale(0.98);
        }

        .account-left {
            display: flex;
            align-items: center;
            gap: 14px;
        }

        .account-badge {
            width: 44px;
            height: 44px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
        }

        /* History */
        .history-section {
            display: flex;
            flex-direction: column;
            gap: 12px;
            margin-top: 10px;
        }

        .filters-row {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            padding-bottom: 4px;
        }

        .filter-btn {
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            color: var(--text-muted);
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }

        .filter-btn.active {
            background: var(--text-main);
            color: var(--bg);
            border-color: var(--text-main);
        }

        .history-list {
            display: flex;
            flex-direction: column;
            gap: 8px;
            max-height: 260px;
            overflow-y: auto;
        }

        .history-item {
            padding: 12px 14px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            border-radius: 14px;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
        }

        /* Modals */
        .modal-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            backdrop-filter: blur(4px);
            z-index: 100;
            display: flex;
            align-items: flex-end;
            justify-content: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }

        .modal-overlay.open {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            width: 100%;
            max-width: 440px;
            background: var(--surface);
            border-top: 1px solid var(--border-color);
            border-radius: 28px 28px 0 0;
            padding: 24px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            transform: translateY(100%);
            transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
            max-height: 90vh;
            overflow-y: auto;
        }

        .modal-overlay.open .modal-content {
            transform: translateY(0);
        }

        .modal-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .form-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .form-label {
            font-size: 12px;
            font-weight: 600;
            color: var(--text-muted);
        }

        .form-input, .form-select {
            width: 100%;
            background: var(--surface-card);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 14px;
            color: var(--text-main);
            font-size: 16px;
            font-family: inherit;
            outline: none;
        }

        .form-input:focus, .form-select:focus {
            border-color: var(--primary);
        }

        .btn-submit {
            width: 100%;
            height: 50px;
            border-radius: 14px;
            background: var(--primary);
            color: #fff;
            font-weight: 700;
            font-size: 15px;
            border: none;
            cursor: pointer;
            margin-top: 8px;
        }

        /* Toast notification */
        #toast {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%) translateY(-20px);
            background: #27272a;
            color: #fff;
            padding: 10px 20px;
            border-radius: 30px;
            font-size: 13px;
            font-weight: 600;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            z-index: 200;
            opacity: 0;
            pointer-events: none;
            transition: 0.3s ease;
            border: 1px solid var(--border-color);
        }

        #toast.show {
            opacity: 1;
            transform: translateX(-50%) translateY(0);
        }
    </style>
</head>
<body>

    <div class="app-container">
        <!-- Header -->
        <header>
            <div class="top-bar">
                <div class="brand-info">
                    <div class="brand-icon">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12V7H5a2 2 0 0 1 0-4h14v4"/><path d="M3 5v14a2 2 0 0 0 2 2h16v-5"/><path d="M18 12a2 2 0 0 0 0 4h4v-4Z"/></svg>
                    </div>
                    <div>
                        <span style="font-size: 10px; font-weight: 700; text-transform: uppercase; color: var(--text-muted); letter-spacing: 0.5px;">Vault Balance</span>
                        <h1 style="font-size: 14px; font-weight: 700;">Personal Hub</h1>
                    </div>
                </div>

                <div class="action-btns">
                    <button class="icon-btn" id="privacyBtn" onclick="togglePrivacy()" title="Privacy Mode">
                        <svg id="privacySvg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                    </button>
                    <button class="icon-btn" onclick="confirmReset()" title="Reset Data">
                        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                    </button>
                </div>
            </div>

            <!-- Net Worth Card -->
            <div class="glass-card net-worth-card">
                <p style="font-size: 12px; font-weight: 500; color: var(--text-muted);">Total Net Worth</p>
                <h2 id="totalBalance" class="balance-text">₱0.00</h2>
                
                <div class="distribution-bar" id="distributionBar"></div>
            </div>

            <!-- Quick Action Buttons -->
            <div class="grid-actions">
                <button class="btn-action btn-primary-action" onclick="openModal('addTransactionModal')">
                    + Log
                </button>
                <button class="btn-action btn-secondary-action" onclick="openModal('quickUpdateModal')">
                    Update All
                </button>
                <button class="btn-action btn-outline-action" onclick="openModal('transferModal')">
                    Transfer
                </button>
            </div>
        </header>

        <!-- Main Section -->
        <main>
            <div class="section-title">
                <span>Accounts</span>
                <span style="font-size: 10px; text-transform: none; font-weight: 400;">Tap card to edit</span>
            </div>

            <div class="accounts-list" id="accountsList">
                <!-- Populated dynamically -->
            </div>

            <!-- Transaction History -->
            <div class="history-section">
                <div class="section-title">
                    <span>Transaction History</span>
                    <span id="txCountBadge" style="background: var(--surface-card); padding: 2px 8px; border-radius: 10px; font-size: 10px;">0</span>
                </div>

                <div class="filters-row">
                    <button class="filter-btn active" onclick="setTxFilter('all', this)">All</button>
                    <button class="filter-btn" onclick="setTxFilter('income', this)">Income</button>
                    <button class="filter-btn" onclick="setTxFilter('expense', this)">Expense</button>
                    <button class="filter-btn" onclick="setTxFilter('transfer', this)">Transfer</button>
                </div>

                <div class="history-list" id="historyList">
                    <!-- Populated dynamically -->
                </div>
            </div>
        </main>
    </div>

    <!-- MODALS -->

    <!-- 1. Add Transaction Modal -->
    <div class="modal-overlay" id="addTransactionModal">
        <div style="position: absolute; inset: 0;" onclick="closeModal('addTransactionModal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 16px; font-weight: 700;">Log Transaction</h3>
                <button onclick="closeModal('addTransactionModal')" style="background: none; border: none; color: var(--text-muted); cursor: pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
                <button type="button" id="typeExpBtn" onclick="setTxType('expense')" style="padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; border: 1px solid rgba(244,63,94,0.3); background: rgba(244,63,94,0.15); color: var(--rose); cursor: pointer;">Expense</button>
                <button type="button" id="typeIncBtn" onclick="setTxType('income')" style="padding: 12px; border-radius: 12px; font-weight: 700; font-size: 13px; border: 1px solid var(--border-color); background: var(--surface-card); color: var(--text-muted); cursor: pointer;">Income</button>
            </div>

            <div class="form-group">
                <label class="form-label">Amount (PHP)</label>
                <input type="number" step="0.01" id="txAmount" class="form-input" placeholder="0.00" inputmode="decimal">
            </div>

            <div class="form-group">
                <label class="form-label">Account</label>
                <select id="txAccount" class="form-select"></select>
            </div>

            <div class="form-group">
                <label class="form-label">Category</label>
                <select id="txCategory" class="form-select">
                    <option value="Food & Dining">🍔 Food & Dining</option>
                    <option value="Bills & Utilities">⚡ Bills & Utilities</option>
                    <option value="Shopping">🛍️ Shopping</option>
                    <option value="Salary & Income">💼 Salary & Income</option>
                    <option value="Transportation">🚗 Transportation</option>
                    <option value="General">🏷️ General</option>
                </select>
            </div>

            <div class="form-group">
                <label class="form-label">Note (Optional)</label>
                <input type="text" id="txNote" class="form-input" placeholder="e.g. Grocery store">
            </div>

            <button class="btn-submit" onclick="submitTransaction()">Save Transaction</button>
        </div>
    </div>

    <!-- 2. Single Edit Modal -->
    <div class="modal-overlay" id="singleEditModal">
        <div style="position: absolute; inset: 0;" onclick="closeModal('singleEditModal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 id="singleEditTitle" style="font-size: 16px; font-weight: 700;">Edit Balance</h3>
                <button onclick="closeModal('singleEditModal')" style="background: none; border: none; color: var(--text-muted); cursor: pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
            </div>

            <div class="form-group">
                <label class="form-label">New Balance (PHP)</label>
                <input type="number" step="0.01" id="singleEditInput" class="form-input" inputmode="decimal">
            </div>

            <button class="btn-submit" onclick="saveSingleBalance()">Save Changes</button>
        </div>
    </div>

    <!-- 3. Quick Update All Modal -->
    <div class="modal-overlay" id="quickUpdateModal">
        <div style="position: absolute; inset: 0;" onclick="closeModal('quickUpdateModal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 16px; font-weight: 700;">Update All Balances</h3>
                <button onclick="closeModal('quickUpdateModal')" style="background: none; border: none; color: var(--text-muted); cursor: pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
            </div>

            <div id="quickInputsContainer" style="display: flex; flex-direction: column; gap: 12px;"></div>

            <button class="btn-submit" onclick="saveAllBalances()">Update Balances</button>
        </div>
    </div>

    <!-- 4. Transfer Modal -->
    <div class="modal-overlay" id="transferModal">
        <div style="position: absolute; inset: 0;" onclick="closeModal('transferModal')"></div>
        <div class="modal-content">
            <div class="modal-header">
                <h3 style="font-size: 16px; font-weight: 700;">Transfer Funds</h3>
                <button onclick="closeModal('transferModal')" style="background: none; border: none; color: var(--text-muted); cursor: pointer;"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M18 6 6 18"/><path d="m6 6 12 12"/></svg></button>
            </div>

            <div class="form-group">
                <label class="form-label">From Account</label>
                <select id="transferFrom" class="form-select"></select>
            </div>

            <div class="form-group">
                <label class="form-label">To Account</label>
                <select id="transferTo" class="form-select"></select>
            </div>

            <div class="form-group">
                <label class="form-label">Amount (PHP)</label>
                <input type="number" step="0.01" id="transferAmount" class="form-input" placeholder="0.00" inputmode="decimal">
            </div>

            <button class="btn-submit" onclick="executeTransfer()">Confirm Transfer</button>
        </div>
    </div>

    <!-- Toast -->
    <div id="toast"><span id="toastMsg">Success</span></div>

    <!-- Bulletproof Core Script with SafeStorage Fallback -->
    <script>
        // Bulletproof SafeStorage Engine
        const memoryStore = {};
        const SafeStorage = {
            getItem(key) {
                try {
                    if (typeof localStorage !== 'undefined') {
                        const val = localStorage.getItem(key);
                        if (val !== null) return val;
                    }
                } catch (e) {}
                return memoryStore[key] !== undefined ? memoryStore[key] : null;
            },
            setItem(key, value) {
                try {
                    if (typeof localStorage !== 'undefined') {
                        localStorage.setItem(key, value);
                    }
                } catch (e) {}
                memoryStore[key] = String(value);
            },
            removeItem(key) {
                try {
                    if (typeof localStorage !== 'undefined') {
                        localStorage.removeItem(key);
                    }
                } catch (e) {}
                delete memoryStore[key];
            }
        };

        const DEFAULT_ACCOUNTS = [
            { id: 'gcash', name: 'GCash', balance: 2500.00, color: '#005CE6', iconText: 'GC' },
            { id: 'maribank', name: 'MariBank', balance: 15400.50, color: '#FF5722', iconText: 'MB' },
            { id: 'gotyme', name: 'GoTyme', balance: 8200.75, color: '#00D2C8', iconText: 'GT' },
            { id: 'bpi', name: 'BPI', balance: 34100.00, color: '#B30006', iconText: 'BP' }
        ];

        let accounts = [];
        let historyLogs = [];
        let isPrivacyHidden = false;
        let activeEditAccountId = null;
        let activeTxType = 'expense';
        let currentTxFilter = 'all';

        // Initialize on Load
        window.addEventListener('DOMContentLoaded', () => {
            loadData();
            renderApp();
        });

        function loadData() {
            try {
                const accStored = SafeStorage.getItem('wallet_accounts');
                const histStored = SafeStorage.getItem('wallet_history');
                const privStored = SafeStorage.getItem('wallet_privacy');

                accounts = accStored ? JSON.parse(accStored) : JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
                historyLogs = histStored ? JSON.parse(histStored) : [
                    { id: Date.now(), title: 'Wallet Initialized', amount: 0, type: 'info', category: 'System', date: 'Today', time: '12:00 PM', accountId: 'all' }
                ];
                isPrivacyHidden = privStored === 'true';
            } catch (e) {
                accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
                historyLogs = [];
            }
        }

        function saveData() {
            try {
                SafeStorage.setItem('wallet_accounts', JSON.stringify(accounts));
                SafeStorage.setItem('wallet_history', JSON.stringify(historyLogs));
                SafeStorage.setItem('wallet_privacy', isPrivacyHidden);
            } catch (e) {}
        }

        function formatPHP(amount) {
            return '₱' + Number(amount).toLocaleString('en-PH', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        function renderApp() {
            renderSummary();
            renderAccounts();
            renderHistory();
            applyPrivacy();
        }

        function renderSummary() {
            const total = accounts.reduce((acc, item) => acc + item.balance, 0);
            document.getElementById('totalBalance').textContent = formatPHP(total);

            // Distribution bar
            const bar = document.getElementById('distributionBar');
            bar.innerHTML = '';
            accounts.forEach(acc => {
                const pct = total > 0 ? (acc.balance / total) * 100 : 0;
                if (pct > 0) {
                    const seg = document.createElement('div');
                    seg.style.width = `${pct}%`;
                    seg.style.background = acc.color;
                    seg.style.height = '100%';
                    bar.appendChild(seg);
                }
            });
        }

        function renderAccounts() {
            const container = document.getElementById('accountsList');
            container.innerHTML = '';

            accounts.forEach(acc => {
                const card = document.createElement('div');
                card.className = 'glass-card account-card';
                card.style.borderLeftColor = acc.color;
                card.onclick = () => openSingleEdit(acc.id);

                card.innerHTML = `
                    <div class="account-left">
                        <div class="account-badge" style="background: ${acc.color}15; color: ${acc.color};">
                            ${acc.iconText}
                        </div>
                        <div>
                            <h4 style="font-size: 14px; font-weight: 700;">${acc.name}</h4>
                            <span style="font-size: 11px; color: var(--text-muted);">Tap to edit</span>
                        </div>
                    </div>
                    <div style="font-size: 16px; font-weight: 800;" class="balance-text">
                        ${formatPHP(acc.balance)}
                    </div>
                `;
                container.appendChild(card);
            });
        }

        function renderHistory() {
            const container = document.getElementById('historyList');
            container.innerHTML = '';

            const filtered = historyLogs.filter(log => currentTxFilter === 'all' || log.type === currentTxFilter);
            document.getElementById('txCountBadge').textContent = filtered.length;

            if (filtered.length === 0) {
                container.innerHTML = `<div style="text-align: center; font-size: 12px; color: var(--text-muted); padding: 20px;">No transactions recorded.</div>`;
                return;
            }

            filtered.forEach(log => {
                const item = document.createElement('div');
                item.className = 'history-item';

                let sign = '';
                let colorClass = 'color: var(--text-main);';
                if (log.type === 'income') { sign = '+'; colorClass = 'color: var(--emerald);'; }
                if (log.type === 'expense') { sign = '-'; colorClass = 'color: var(--rose);'; }

                const accObj = accounts.find(a => a.id === log.accountId);
                const accName = accObj ? accObj.name : '';

                item.innerHTML = `
                    <div>
                        <h5 style="font-size: 13px; font-weight: 700;">${log.title}</h5>
                        <p style="font-size: 10px; color: var(--text-muted);">${log.category || 'General'} • ${log.date || ''} ${log.time}</p>
                    </div>
                    <div style="text-align: right;">
                        ${log.amount !== 0 ? `<div style="font-size: 13px; font-weight: 800; ${colorClass}" class="balance-text">${sign}${formatPHP(log.amount)}</div>` : ''}
                        <span style="font-size: 9px; color: var(--text-muted); text-transform: uppercase;">${accName}</span>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        // Privacy Mode
        function togglePrivacy() {
            isPrivacyHidden = !isPrivacyHidden;
            applyPrivacy();
            saveData();
        }

        function applyPrivacy() {
            const balances = document.querySelectorAll('.balance-text');
            const svg = document.getElementById('privacySvg');
            if (isPrivacyHidden) {
                balances.forEach(el => el.classList.add('blur-balance'));
                svg.innerHTML = '<path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.526 13.526 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" x2="22" y1="2" y2="22"/>';
            } else {
                balances.forEach(el => el.classList.remove('blur-balance'));
                svg.innerHTML = '<path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/>';
            }
        }

        // Modals Control
        function openModal(modalId) {
            if (modalId === 'addTransactionModal') populateTxAccounts();
            if (modalId === 'quickUpdateModal') buildQuickInputs();
            if (modalId === 'transferModal') buildTransferSelects();
            document.getElementById(modalId).classList.add('open');
        }

        function closeModal(modalId) {
            document.getElementById(modalId).classList.remove('open');
        }

        // Transaction Type Toggle
        function setTxType(type) {
            activeTxType = type;
            const exp = document.getElementById('typeExpBtn');
            const inc = document.getElementById('typeIncBtn');
            if (type === 'expense') {
                exp.style.background = 'rgba(244,63,94,0.15)';
                exp.style.borderColor = 'rgba(244,63,94,0.3)';
                exp.style.color = 'var(--rose)';
                inc.style.background = 'var(--surface-card)';
                inc.style.borderColor = 'var(--border-color)';
                inc.style.color = 'var(--text-muted)';
            } else {
                inc.style.background = 'rgba(16,185,129,0.15)';
                inc.style.borderColor = 'rgba(16,185,129,0.3)';
                inc.style.color = 'var(--emerald)';
                exp.style.background = 'var(--surface-card)';
                exp.style.borderColor = 'var(--border-color)';
                exp.style.color = 'var(--text-muted)';
            }
        }

        function populateTxAccounts() {
            const sel = document.getElementById('txAccount');
            sel.innerHTML = '';
            accounts.forEach(a => {
                sel.innerHTML += `<option value="${a.id}">${a.name} (${formatPHP(a.balance)})</option>`;
            });
        }

        function submitTransaction() {
            const amt = parseFloat(document.getElementById('txAmount').value);
            const accId = document.getElementById('txAccount').value;
            const cat = document.getElementById('txCategory').value;
            const note = document.getElementById('txNote').value;

            if (isNaN(amt) || amt <= 0) {
                showToast('Enter valid amount');
                return;
            }

            const acc = accounts.find(a => a.id === accId);
            if (!acc) return;

            if (activeTxType === 'expense') {
                acc.balance -= amt;
                logHistory(`${acc.name} Expense`, amt, 'expense', cat, acc.id);
            } else {
                acc.balance += amt;
                logHistory(`${acc.name} Income`, amt, 'income', cat, acc.id);
            }

            saveData();
            renderApp();
            closeModal('addTransactionModal');
            showToast('Transaction saved');
            document.getElementById('txAmount').value = '';
            document.getElementById('txNote').value = '';
        }

        // Single Edit
        function openSingleEdit(id) {
            activeEditAccountId = id;
            const acc = accounts.find(a => a.id === id);
            if (!acc) return;
            document.getElementById('singleEditTitle').textContent = `Edit ${acc.name}`;
            document.getElementById('singleEditInput').value = acc.balance;
            openModal('singleEditModal');
        }

        function saveSingleBalance() {
            const val = parseFloat(document.getElementById('singleEditInput').value);
            if (isNaN(val) || val < 0) {
                showToast('Enter valid balance');
                return;
            }
            const acc = accounts.find(a => a.id === activeEditAccountId);
            if (acc) {
                acc.balance = val;
                logHistory(`${acc.name} Adjusted`, 0, 'update', 'System', acc.id);
                saveData();
                renderApp();
                closeModal('singleEditModal');
                showToast('Balance updated');
            }
        }

        // Quick Update All
        function buildQuickInputs() {
            const container = document.getElementById('quickInputsContainer');
            container.innerHTML = '';
            accounts.forEach(acc => {
                container.innerHTML += `
                    <div class="form-group">
                        <label class="form-label">${acc.name}</label>
                        <input type="number" step="0.01" class="form-input quick-input" data-id="${acc.id}" value="${acc.balance}" inputmode="decimal">
                    </div>
                `;
            });
        }

        function saveAllBalances() {
            const inputs = document.querySelectorAll('.quick-input');
            inputs.forEach(input => {
                const id = input.getAttribute('data-id');
                const val = parseFloat(input.value);
                const acc = accounts.find(a => a.id === id);
                if (acc && !isNaN(val)) {
                    acc.balance = val;
                }
            });
            saveData();
            renderApp();
            closeModal('quickUpdateModal');
            showToast('All balances updated');
        }

        // Transfer
        function buildTransferSelects() {
            const from = document.getElementById('transferFrom');
            const to = document.getElementById('transferTo');
            from.innerHTML = '';
            to.innerHTML = '';
            accounts.forEach(a => {
                from.innerHTML += `<option value="${a.id}">${a.name} (${formatPHP(a.balance)})</option>`;
                to.innerHTML += `<option value="${a.id}">${a.name}</option>`;
            });
            if (accounts.length > 1) to.selectedIndex = 1;
        }

        function executeTransfer() {
            const fromId = document.getElementById('transferFrom').value;
            const toId = document.getElementById('transferTo').value;
            const amt = parseFloat(document.getElementById('transferAmount').value);

            if (fromId === toId) {
                showToast('Select different accounts');
                return;
            }
            if (isNaN(amt) || amt <= 0) {
                showToast('Enter valid transfer amount');
                return;
            }

            const fromAcc = accounts.find(a => a.id === fromId);
            const toAcc = accounts.find(a => a.id === toId);

            if (fromAcc.balance < amt) {
                showToast('Insufficient funds');
                return;
            }

            fromAcc.balance -= amt;
            toAcc.balance += amt;

            logHistory(`${fromAcc.name} ➔ ${toAcc.name}`, amt, 'transfer', 'Transfer', fromAcc.id);
            saveData();
            renderApp();
            closeModal('transferModal');
            showToast('Transfer completed');
        }

        function setTxFilter(type, btn) {
            currentTxFilter = type;
            document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            renderHistory();
        }

        function logHistory(title, amount, type, category, accountId) {
            const now = new Date();
            historyLogs.unshift({
                id: Date.now(),
                title,
                amount,
                type,
                category,
                date: now.toLocaleDateString([], { month: 'short', day: 'numeric' }),
                time: now.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                accountId
            });
            if (historyLogs.length > 50) historyLogs.pop();
        }

        function confirmReset() {
            if (confirm('Reset all balances and history?')) {
                accounts = JSON.parse(JSON.stringify(DEFAULT_ACCOUNTS));
                historyLogs = [];
                saveData();
                renderApp();
                showToast('App reset to defaults');
            }
        }

        function showToast(msg) {
            const toast = document.getElementById('toast');
            document.getElementById('toastMsg').textContent = msg;
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 2000);
        }
    </script>
</body>
</html>
